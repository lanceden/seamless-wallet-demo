name: seamless-wallet-demo   # 固定 compose 專案名稱，k6 腳本才找得到 seamless-wallet-demo_default 網路（與資料夾名稱無關）

services:
  postgres:
    image: postgres:16-alpine
    container_name: wallet-postgres
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    command: ["postgres", "-c", "max_connections=300"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 本機 5432 常被佔用，對外改 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wallet-redis
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: wallet-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=wallet;Username=wallet;Password=wallet;Maximum Pool Size=200"
    ports:
      - "8080:8080"
    volumes:
      - ./reports:/app/reports   # 遊戲商報表放這裡，對帳排程／API 從這讀
    restart: unless-stopped

  slot-gameserver:
    build:
      context: .
      dockerfile: Dockerfile.slot
    container_name: slot-gameserver
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=wallet;Username=wallet;Password=wallet;Maximum Pool Size=100"
      Wallet__BaseUrl: "http://wallet-api:8080"
      Wallet__ProviderCode: "SLOT"
      Wallet__Secret: "slot-secret"          # demo 用，與錢包 migration 004 種的 SLOT 遊戲商一致
      Game__ClientUrl: "http://localhost:8082/"   # 遊戲前端（H5）的網址；開局回傳 gameUrl 會接上 ?token=...
      Report__Directory: "/app/reports"
    ports:
      - "8081:8081"
    volumes:
      - ./reports:/app/reports   # 遊戲商報表放這裡，錢包的對帳從這讀
    restart: unless-stopped

volumes:
  pgdata:
