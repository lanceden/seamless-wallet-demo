server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cocos H5 以 JS / JSON / wasm 為主，壓縮後約 2.7 MB（原始 7.6 MB）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/wasm image/svg+xml;

    # 進入點不快取，讓更新後的版本立刻生效；其餘資源檔名帶 hash，可以長快取
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=86400"; }
    location /cocos-js/ { add_header Cache-Control "public, max-age=86400"; }

}
